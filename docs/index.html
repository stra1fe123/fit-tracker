<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fit Tracker</title>
  <meta name="theme-color" content="#16a34a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Fit Tracker">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1 id="title">Питание</h1>
    <span id="sync" class="sync" title="Синхронизация"></span>
  </header>

  <main id="view"></main>

  <nav class="tabs">
    <button data-tab="food" class="active"><span>🍽️</span>Питание</button>
    <button data-tab="workouts"><span>🏋️</span>Тренировки</button>
    <button data-tab="progress"><span>📈</span>Прогресс</button>
    <button data-tab="profile"><span>⚙️</span>Профиль</button>
  </nav>

  <div id="toast" class="toast"></div>

  <script src="app.js"></script>
</body>
</html>
